version: 2

before:
  hooks:
    - cargo fetch --locked

builds:
  - id: tanca-mcp
    builder: rust
    binary: tanca-mcp
    command: zigbuild
    flags:
      - --release
      - --locked
      - --bin=tanca-mcp
    targets: &targets
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm

  - id: tanca-cli
    builder: rust
    binary: tanca-cli
    command: zigbuild
    flags:
      - --release
      - --locked
      - --bin=tanca-cli
    targets: *targets

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

brews:
  # One archive per platform holds both binaries; each formula installs one.
  - name: tanca-mcp
    repository:
      owner: nguyenvanduocit
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/nguyenvanduocit/tanca-mcp"
    description: "tanca-mcp - MCP server"
    install: |
      bin.install "tanca-mcp"

  - name: tanca-cli
    repository:
      owner: nguyenvanduocit
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/nguyenvanduocit/tanca-mcp"
    description: "tanca-cli - CLI tool"
    install: |
      bin.install "tanca-cli"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
